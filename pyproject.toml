[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "touchline-datasets"
version = "0.1.0"
description = "Broadcast football to player tracklets and traceable pose windows"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0", "starlette>=1.3.1,<2", "uvicorn==0.37.0", "python-multipart>=0.0.18",
  "opencv-python>=4.10,<5", "ultralytics==8.3.174", "torch>=2.2",
  "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "PyYAML>=6", "lap>=0.5.12",
  "huggingface_hub>=2.2"
]
[project.optional-dependencies]
azure = ["azure-identity>=1.19,<2", "azure-storage-blob>=12.24,<13"]
test = ["pytest>=8", "httpx>=0.27"]
import = ["pandas>=2", "pyarrow>=15"]
[tool.setuptools.packages.find]
include = ["retrieval*", "pose*"]
[tool.setuptools.package-data]
"retrieval.vendor" = ["TORCHREID_LICENSE"]
[tool.pytest.ini_options]
testpaths = ["tests"]
